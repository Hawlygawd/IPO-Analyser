name: Probe GMP sources

# Temporary reconnaissance: ipomarket.in claims a 30-minute refresh, which would make it the
# first source fresher than IPO Ji's evening quote. This mirrors its markup so a parser can be
# written against the real thing. Delete once the source is parsed (or ruled out).

on:
  push:
    tags:
      - 'probe-gmp-*'
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch the pages
        run: |
          set -o pipefail
          mkdir -p pages
          MOBILE="Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Mobile Safari/537.36"
          STAMP=$(date +%s)
          get() {
            local name="$1" url="$2" ua="${3:-$MOBILE}"
            local code
            code=$(curl -sS -L -A "$ua" -H 'Cache-Control: no-cache' -o "pages/$name.html" \
                   -w '%{http_code}' --max-time 25 "$url" 2>"pages/$name.err" || true)
            printf '%s\t%s\t%s\t%s\n' "$name" "$url" "$code" "$(wc -c < "pages/$name.html" 2>/dev/null || echo 0)"
          }
          : > status.tsv
          get home        "https://ipomarket.in/"                          >> status.tsv
          get home-busted "https://ipomarket.in/?_=${STAMP}"               >> status.tsv
          get gmp         "https://ipomarket.in/gmp/"                      >> status.tsv
          get ipo-gmp     "https://ipomarket.in/ipo-gmp/"                  >> status.tsv
          get grey        "https://ipomarket.in/grey-market-premium/"      >> status.tsv
          get sitemap     "https://ipomarket.in/sitemap_index.xml"         >> status.tsv
          get wp-pages    "https://ipomarket.in/wp-json/wp/v2/pages?per_page=20&_fields=slug,title,link" >> status.tsv
          get wp-posts    "https://ipomarket.in/wp-json/wp/v2/posts?per_page=5&_fields=slug,title,date,link" >> status.tsv
          cat status.tsv

      - name: Mirror the structures worth parsing
        run: |
          node - <<'NODE' > report.md
          const fs = require('node:fs');
          const status = fs.readFileSync('status.tsv', 'utf8').trim().split('\n').map((l) => l.split('\t'));
          const out = [`# ipomarket.in, probed from a runner`, '', `Run ${new Date().toISOString()}`, ''];
          out.push('| page | HTTP | bytes |', '| --- | --- | --- |');
          for (const [name, url, code, bytes] of status) out.push(`| ${name} (${url}) | ${code} | ${bytes} |`);
          for (const [name] of status) {
            let html = '';
            try { html = fs.readFileSync(`pages/${name}.html`, 'utf8'); } catch {}
            if (!html || html.length < 200) continue;
            out.push('', `## ${name}`, '');
            const plain = html.replace(/<script[\s\S]*?<\/script>/gi, ' ').replace(/<style[\s\S]*?<\/style>/gi, ' ');
            const stamps = [...new Set((plain.match(/(?:as\s+of|updated|last\s+update[d]?|refreshed)[^<]{0,70}/gi) || []).map((s) => s.replace(/\s+/g, ' ').trim()))].slice(0, 6);
            out.push(`freshness words: ${stamps.join(' / ') || '_none_'}`, '');
            const times = [...plain.matchAll(/<time\b[^>]*\bdatetime="([^"]+)"/g)].map((m) => m[1]).slice(0, 6);
            out.push(`<time datetime>: ${times.join(', ') || '_none_'}`, '');
            for (const m of plain.matchAll(/\b(\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\s+20\d\d(?:,?\s*\d{1,2}:\d{2}\s*(?:AM|PM)?(?:\s*IST)?)?)/g)) {
              out.push(`date-ish text: ${m[1]}`);
              if (out.length > 400) break;
            }
            const tables = [...plain.matchAll(/<table[\s\S]*?<\/table>/gi)].map((m) => m[0]);
            out.push('', `tables on the page: ${tables.length}`, '');
            tables.slice(0, 2).forEach((table, i) => {
              const classes = [...new Set([...table.matchAll(/class="([^"]+)"/g)].map((m) => m[1]))].slice(0, 14);
              out.push(`### table ${i + 1}: ${(table.match(/<tr/gi) || []).length} rows`, '', `classes: ${classes.join(' | ')}`, '');
              const rows = [...table.matchAll(/<tr[\s\S]*?<\/tr>/gi)].slice(0, 5).map((m) => m[0]);
              for (const row of rows) {
                const cells = [...row.matchAll(/<t[dh][^>]*>([\s\S]*?)<\/t[dh]>/gi)].map((m) => m[1].replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim());
                out.push(`- [${cells.join(' | ')}]`);
              }
              out.push('');
            });
            const divSections = [...plain.matchAll(/class="([a-z0-9_-]*(?:gmp|premium|ipo)[a-z0-9_-]*)"/gi)].map((m) => m[1]);
            out.push(`gmp-ish class names: ${[...new Set(divSections)].slice(0, 24).join(' | ') || '_none_'}`, '');
          }
          console.log(out.join('\n'));
          NODE
          wc -c report.md

      - name: Publish the report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          head -c 60000 report.md > part-1.md
          jq -Rs '{name: "gmp-sources", head_sha: env.SHA, status: "completed", conclusion: "neutral",
                   output: {title: "ipomarket.in structure, mirrored", summary: .}}' part-1.md > payload.json
          gh api "repos/${{ github.repository }}/check-runs" -X POST --input payload.json >/dev/null && echo published || echo "could not publish"
