name: Probe GMP sources

# Temporary reconnaissance. ipomarket.in/gmp/ carries per-row "Updated 14 Sept, 20:45" stamps,
# hours fresher than IPO Ji's evening quote - this mirrors the exact markup (and any JSON the
# page ships) so a parser can be written against the real thing, then the workflow is deleted.

on:
  push:
    tags:
      - 'probe-gmp-*'
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch the page
        run: |
          set -o pipefail
          mkdir -p pages
          MOBILE="Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Mobile Safari/537.36"
          curl -sS -L -A "$MOBILE" -H 'Cache-Control: no-cache' -o pages/gmp.html -w 'gmp: %{http_code} %{size_download}\n' --max-time 30 "https://ipomarket.in/gmp/"
          curl -sS -L -A "$MOBILE" -H 'Cache-Control: no-cache' -o pages/gmp2.html -w 'gmp2: %{http_code} %{size_download}\n' --max-time 30 "https://ipomarket.in/gmp/?_=$(date +%s)"

      - name: Mirror the table markup and any embedded JSON
        run: |
          node - <<'NODE' > report.md
          const fs = require('node:fs');
          const html = fs.readFileSync('pages/gmp.html', 'utf8');
          const out = [`# ipomarket.in/gmp/ markup`, '', `Run ${new Date().toISOString()}`, `bytes: ${html.length}`, ''];
          if (html.includes('__NEXT_DATA__')) {
            const m = html.match(/<script[^>]+id="__NEXT_DATA__"[^>]*>([\s\S]*?)<\/script>/);
            out.push('## __NEXT_DATA__ found', '', '```json', (m ? m[1] : '').slice(0, 6000), '```', '');
          } else {
            out.push('## no __NEXT_DATA__ payload', '');
          }
          for (const [i, m] of [...html.matchAll(/<table[\s\S]*?<\/table>/gi)].entries()) {
            if (i > 1) break;
            out.push(`## table ${i + 1} (raw, first 9000 chars)`, '', '```html', m[0].slice(0, 9000), '```', '');
          }
          const header = html.search(/Last updated/i);
          if (header >= 0) {
            out.push('## around "Last updated"', '', '```html', html.slice(Math.max(0, header - 500), header + 500), '```', '');
          }
          const firstRow = html.match(/<tr[\s\S]*?<\/tr>/i);
          if (firstRow) out.push('## first <tr>', '', '```html', firstRow[0].slice(0, 2000), '```');
          console.log(out.join('\n'));
          NODE
          wc -c report.md

      - name: Publish the report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          head -c 60000 report.md > part-1.md
          jq -Rs '{name: "gmp-sources", head_sha: env.SHA, status: "completed", conclusion: "neutral",
                   output: {title: "ipomarket.in/gmp/ raw markup", summary: .}}' part-1.md > payload.json
          gh api "repos/${{ github.repository }}/check-runs" -X POST --input payload.json >/dev/null && echo published || echo "could not publish"
