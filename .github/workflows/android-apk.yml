name: Android APK

on:
  push:
    branches:
      - arena/533f3002-ipo-analyser
    paths:
      - app.json
      - assets/**
      - package.json
      - package-lock.json
      - index.ts
      - App.tsx
      - src/**
      - tests/**
      - scripts/**
      - .github/workflows/android-apk.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish installable APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_IPO_API_URL: ${{ vars.EXPO_PUBLIC_IPO_API_URL }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run application checks
        run: |
          npm test
          npx tsc --noEmit
          npm run build

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Prepare release signing and ABIs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          REACT_NATIVE_ARCHITECTURES: arm64-v8a,armeabi-v7a
        run: node scripts/android-release.mjs

      - name: Build release APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease -x lintVitalRelease

      - name: Inspect and checksum APK
        id: apk
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -l "$APK" | grep -E 'lib/|index.android.bundle|classes.dex'
          VERSION="$(node -p "require('./app.json').expo.version")"
          FILE="ipo-pulse-${VERSION}.apk"
          cp "$APK" "$FILE"
          sha256sum "$FILE" > "${FILE}.sha256"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.apk.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: IPO Pulse ${{ steps.apk.outputs.version }} - Android APK
          prerelease: false
          make_latest: true
          files: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.file }}.sha256
          body: |
            Installable Android APK built from `${{ github.sha }}` on `${{ github.ref_name }}`.

            This update corrects the IPO feed/source handling, subscription categories, persisted watchlist/reminders, and refresh behavior. NSE/BSE live routes are undocumented website endpoints and may be limited or unavailable; SEBI is linked for offer-document verification, not live bids. GMP is unofficial.

            Live refresh in this native APK requires the repository Actions variable `EXPO_PUBLIC_IPO_API_URL` to have been configured with the public `/api/ipoFeed` URL before this build. If it was not set, the app keeps its bundled/offline data and cannot refresh its live feed. No provider API keys are included in the APK.

            The APK keeps the existing `com.ipopulse.app` application ID. It uses the repository release-signing key if configured; otherwise it is signed with Expo's test/debug key and is not for Play Store distribution. If Android rejects an in-place update because the key differs, uninstall the older app first, then install this APK.

            Download `ipo-pulse-${{ steps.apk.outputs.version }}.apk` and verify it with the adjacent `.sha256` file. On Android, open the APK and allow installation from this source when prompted.
