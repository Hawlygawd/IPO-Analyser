name: Probe source

# Temporary reconnaissance: fetches the upstream IPO pages from a GitHub runner (which has open
# internet, unlike the sandbox) and mirrors what came back into a check run so the result is
# readable through the API. Answers one question: what is the most robust thing to parse -
# embedded JSON, or the table markup?

on:
  push:
    tags:
      - 'probe-*'
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the pages
        run: |
          set -o pipefail
          mkdir -p pages
          : > report.md
          UA="Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Mobile Safari/537.36"
          i=0
          for url in \
            "https://www.ipoji.com/ipo-gmp" \
            "https://www.ipoji.com/ipo-subscription-status-live-bidding-data-bse-nse" \
            "https://www.ipoji.com/ipo/current-ipo" \
            "https://www.ipoji.com/ipo/upcoming-ipo" \
            "https://www.ipoji.com/ipo-event-calendar" ; do
            i=$((i+1))
            name="page-${i}"
            code=$(curl -sS -L -A "$UA" -H "Accept-Language: en-IN,en;q=0.9" \
                     -o "pages/${name}.html" -w '%{http_code}' --max-time 30 "$url" || echo "000")
            size=$(wc -c < "pages/${name}.html" 2>/dev/null || echo 0)
            {
              echo "## ${url}"
              echo "- status: ${code}, bytes: ${size}"
              echo "- next_data: $(grep -c '__NEXT_DATA__' "pages/${name}.html" || true)   json_scripts: $(grep -o 'type=\"application/json\"' "pages/${name}.html" | wc -l)   tables: $(grep -o '<table' "pages/${name}.html" | wc -l)"
              echo "- api paths in source: $(grep -oE '\"/api/[a-zA-Z0-9/_-]+' "pages/${name}.html" | sort -u | head -8 | tr '\n' ' ')"
              echo "- title: $(grep -oE '<title>[^<]*' "pages/${name}.html" | head -1)"
              echo
              if [ "$size" -gt 1000 ]; then
                echo "### first 2500 chars of the parsed-looking markup (scripts stripped)"
                sed 's/<script[^>]*>.*<\/script>//g' "pages/${name}.html" | tr -s ' \n' ' ' | cut -c1-2500
                echo
                echo
                echo "### json-ish script blocks"
                grep -oE 'type="application/json"[^>]*>.{0,400}' "pages/${name}.html" | head -4
                echo
              fi
              echo "---"
              echo
            } >> report.md
          done
          wc -c report.md

      - name: Publish the report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          jq -Rs '{name: "source-probe", head_sha: env.SHA, status: "completed", conclusion: "neutral",
                   output: {title: "Upstream source reconnaissance", summary: .}}' report.md > payload.json
          gh api "repos/${{ github.repository }}/check-runs" -X POST --input payload.json >/dev/null &&
            echo published || echo "could not publish"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-pages
          path: pages/
          if-no-files-found: warn
